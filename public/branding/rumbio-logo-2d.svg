<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Brand Official Color Filters -->
    <filter id="subtleGlow2D" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A2F5E" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ISOTYPE GROUP -->
  <g id="rumbio-isotype-2d" transform="translate(45, 20)">
    <!-- 1. Dark Blue Lower Curve Leg (#0A2F5E) -->
    <path 
      d="M 120 185 C 120 220 135 250 160 270 C 180 286 210 292 235 272" 
      stroke="#0A2F5E" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 2. Main Turquoise 'R' Travel Route (#33C7C7) -->
    <path 
      d="M 28 40 L 140 40 C 185 40 225 72 225 118 C 225 160 190 192 145 192 C 100 192 70 225 70 270 C 70 295 90 315 115 315" 
      stroke="#33C7C7" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 3. Upper Bowl Location Pin (#0A2F5E) with Waypoint Connector -->
    <!-- Waypoint route connector line -->
    <path 
      d="M 205 95 C 190 95 175 95 155 95" 
      stroke="#33C7C7" 
      stroke-width="6" 
      stroke-linecap="round"
    />
    <circle cx="205" cy="95" r="7" fill="#33C7C7" />

    <!-- Dark Blue Location Pin -->
    <g transform="translate(145, 55)">
      <path 
        d="M 16 0 C 7.2 0 0 7.2 0 16 C 0 27 16 44 16 44 C 16 44 32 27 32 16 C 32 7.2 24.8 0 16 0 Z" 
        fill="#0A2F5E" 
      />
      <!-- Center white node -->
      <circle cx="16" cy="15" r="5.5" fill="#FFFFFF" />
    </g>

    <!-- 4. Gold Destination Location Pin (#C8A14D) on Lower Right -->
    <g transform="translate(208, 185)">
      <path 
        d="M 20 0 C 9 0 0 9 0 20 C 0 34 20 54 20 54 C 20 54 40 34 40 20 C 40 9 31 0 20 0 Z" 
        fill="#C8A14D" 
      />
      <!-- Inner Embossed Golden Crescent/Coin -->
      <circle cx="20" cy="19" r="8" fill="#FFFFFF" fill-opacity="0.3" />
      <circle cx="23" cy="18" r="6.5" fill="#C8A14D" />
    </g>
  </g>

  <!-- WORDMARK: Rumbio (#0A2F5E) -->
  <g id="rumbio-wordmark-2d" transform="translate(200, 420)">
    <text 
      text-anchor="middle" 
      font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" 
      font-size="68" 
      font-weight="800" 
      letter-spacing="-1.5" 
      fill="#0A2F5E"
    >
      Rumbio
    </text>
  </g>
</svg>

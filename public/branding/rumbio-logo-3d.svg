<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Realistic Lighting & Shading Gradients -->
    <linearGradient id="r3dTurquoise" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#66E2E2" />
      <stop offset="40%" stopColor="#33C7C7" />
      <stop offset="85%" stopColor="#1E9E9E" />
      <stop offset="100%" stopColor="#126868" />
    </linearGradient>

    <linearGradient id="r3dDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#184888" />
      <stop offset="45%" stopColor="#0A2F5E" />
      <stop offset="90%" stopColor="#051C3A" />
      <stop offset="100%" stopColor="#020E20" />
    </linearGradient>

    <linearGradient id="r3dGold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stopColor="#E8CA7C" />
      <stop offset="45%" stopColor="#C8A14D" />
      <stop offset="90%" stopColor="#967226" />
      <stop offset="100%" stopColor="#634A14" />
    </linearGradient>

    <linearGradient id="r3dWordmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#14427C" />
      <stop offset="50%" stopColor="#0A2F5E" />
      <stop offset="100%" stopColor="#061F40" />
    </linearGradient>

    <!-- 3D Drop Shadows & Relief Depth -->
    <filter id="shadow3DSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0A2F5E" flood-opacity="0.25" />
    </filter>

    <filter id="shadow3DPin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="emboss3D" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.8" specularExponent="20" lighting-color="#FFFFFF" result="specOut">
        <fePointLight x="-5000" y="-10000" z="20000" />
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specIn" />
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>

  <!-- 3D ISOTYPE COMPOSITION -->
  <g id="rumbio-isotype-3d" transform="translate(45, 20)" filter="url(#shadow3DSoft)">
    
    <!-- 1. Deep Dark Blue Under-Curve (#0A2F5E 3D) -->
    <path 
      d="M 120 185 C 120 220 135 250 160 270 C 180 286 210 292 235 272" 
      stroke="url(#r3dDarkBlue)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Gloss highlight along blue spine -->
    <path 
      d="M 124 185 C 124 216 137 244 160 262 C 178 277 204 284 228 266" 
      stroke="#4A7BC7" 
      stroke-width="5" 
      stroke-linecap="round" 
      fill="none" 
      opacity="0.6"
    />

    <!-- 2. Main Turquoise Route Ribbon 'R' (#33C7C7 3D Pillow Relief) -->
    <!-- Outer Deep Base -->
    <path 
      d="M 28 40 L 140 40 C 185 40 225 72 225 118 C 225 160 190 192 145 192 C 100 192 70 225 70 270 C 70 295 90 315 115 315" 
      stroke="url(#r3dTurquoise)" 
      stroke-width="38" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Inner Groove / Channel characteristic of the 3D model -->
    <path 
      d="M 38 40 L 138 40 C 176 40 210 68 210 116 C 210 152 178 180 142 180 C 108 180 82 208 82 255 C 82 278 98 298 116 298" 
      stroke="#188C8C" 
      stroke-width="6" 
      stroke-linecap="round" 
      fill="none" 
      opacity="0.5"
    />
    <!-- Top-left specular gloss bevel highlight -->
    <path 
      d="M 30 35 L 138 35 C 182 35 220 66 220 114" 
      stroke="#B8F7F7" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      fill="none" 
      opacity="0.85"
    />

    <!-- 3. Upper Bowl 3D Dark Blue Map Pin -->
    <g transform="translate(145, 55)" filter="url(#shadow3DPin)">
      <path 
        d="M 16 0 C 7.2 0 0 7.2 0 16 C 0 27 16 44 16 44 C 16 44 32 27 32 16 C 32 7.2 24.8 0 16 0 Z" 
        fill="url(#r3dDarkBlue)" 
      />
      <!-- Specular Rim highlight -->
      <path 
        d="M 16 2 C 8.5 2 2 8.5 2 16" 
        stroke="#4B86D9" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round"
      />
      <!-- Center 3D embossed core -->
      <circle cx="16" cy="15" r="5.5" fill="#FFFFFF" opacity="0.9" />
      <circle cx="15.5" cy="14.5" r="2" fill="#FFFFFF" />
    </g>

    <!-- 4. Lower Right 3D Gold Location Pin (#C8A14D) -->
    <g transform="translate(208, 185)" filter="url(#shadow3DPin)">
      <path 
        d="M 20 0 C 9 0 0 9 0 20 C 0 34 20 54 20 54 C 20 54 40 34 40 20 C 40 9 31 0 20 0 Z" 
        fill="url(#r3dGold)" 
      />
      <!-- Top gloss rim -->
      <path 
        d="M 20 2 C 10 2 2 10 2 20" 
        stroke="#FCE3A2" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"
      />
      <!-- Inner Embossed 3D Golden Coin / Crescent -->
      <circle cx="20" cy="19" r="8.5" fill="#583F0D" opacity="0.35" />
      <circle cx="19.5" cy="18.5" r="7.5" fill="#F0CE7A" />
      <circle cx="22" cy="18" r="6" fill="#C8A14D" />
    </g>
  </g>

  <!-- 3D WORDMARK EMBOSS: Rumbio -->
  <g id="rumbio-wordmark-3d" transform="translate(200, 420)" filter="url(#shadow3DSoft)">
    <text 
      text-anchor="middle" 
      font-family="'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif" 
      font-size="68" 
      font-weight="800" 
      letter-spacing="-1.5" 
      fill="url(#r3dWordmark)"
    >
      Rumbio
    </text>
  </g>
</svg>

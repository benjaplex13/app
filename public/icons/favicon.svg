<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with Official Brand Navy Depth -->
  <rect width="512" height="512" rx="112" fill="#0A2F5E" />
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0D3B75" />
      <stop offset="60%" stopColor="#0A2F5E" />
      <stop offset="100%" stopColor="#051C3A" />
    </linearGradient>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Centered Rumbio 2D/Vector Isotype (Safe Area Compliant) -->
  <g transform="translate(100, 96)" filter="url(#iconShadow)">
    <!-- 1. Dark Blue / Accent Lower Curve (#051C3A with Cyan rim) -->
    <path 
      d="M 120 185 C 120 220 135 250 160 270 C 180 286 210 292 235 272" 
      stroke="#144A8C" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 2. Main Turquoise Route 'R' (#33C7C7) -->
    <path 
      d="M 28 40 L 140 40 C 185 40 225 72 225 118 C 225 160 190 192 145 192 C 100 192 70 225 70 270 C 70 295 90 315 115 315" 
      stroke="#33C7C7" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- 3. Upper Bowl Waypoint & Navy Pin -->
    <path 
      d="M 205 95 C 190 95 175 95 155 95" 
      stroke="#33C7C7" 
      stroke-width="6" 
      stroke-linecap="round"
    />
    <circle cx="205" cy="95" r="7" fill="#33C7C7" />

    <g transform="translate(145, 55)">
      <path 
        d="M 16 0 C 7.2 0 0 7.2 0 16 C 0 27 16 44 16 44 C 16 44 32 27 32 16 C 32 7.2 24.8 0 16 0 Z" 
        fill="#051C3A" 
        stroke="#33C7C7"
        stroke-width="2"
      />
      <circle cx="16" cy="15" r="5" fill="#FFFFFF" />
    </g>

    <!-- 4. Gold Destination Location Pin (#C8A14D) -->
    <g transform="translate(208, 185)">
      <path 
        d="M 20 0 C 9 0 0 9 0 20 C 0 34 20 54 20 54 C 20 54 40 34 40 20 C 40 9 31 0 20 0 Z" 
        fill="#C8A14D" 
      />
      <circle cx="20" cy="19" r="8" fill="#FFFFFF" fill-opacity="0.35" />
      <circle cx="23" cy="18" r="6.5" fill="#C8A14D" />
    </g>
  </g>
</svg>
